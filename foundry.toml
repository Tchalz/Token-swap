[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[lint]
exclude_lints = [
    "unused-return", "calls-loop", "uninitialized-local", "reentrancy-events",
    "function-init-state", "literal-instead-of-constant",
    "screaming-snake-case-immutable", "missing-events-access-control",
    "divide-before-multiply", "multi-contract-file",
]