<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Token Swap Pool</title>
    <style>
      body { margin: 0; background: #0f1117; color: #e6e8ee; font-family: system-ui, sans-serif; }
      main { max-width: 480px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 0 0 12px; color: #9aa3b5; }
      .card { background: #181b24; border: 1px solid #262b38; border-radius: 12px; padding: 16px; margin-top: 16px; }
      .row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
      .muted { color: #9aa3b5; }
      input { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0; background: #0f1117;
              color: inherit; border: 1px solid #262b38; border-radius: 8px; font-size: 15px; }
      button { padding: 10px 14px; margin: 6px 6px 0 0; background: #4c6fff; color: #fff; border: 0;
               border-radius: 8px; font-size: 14px; cursor: pointer; }
      button.alt { background: #262b38; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .msg { margin-top: 16px; font-size: 13px; color: #9aa3b5; word-break: break-word; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
